name: Update LLM prices

on:
  schedule:
    - cron: "15 6 * * *"   # 06:15 UTC daily (10:15 Abu Dhabi)
  workflow_dispatch:        # manual "Run workflow" button
  push:
    branches: [main]
    paths: ["index.html"]   # redeploy when the page itself changes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices and rebuild data
        if: github.event_name != 'push'
        run: python scripts/build_data.py

      - name: Commit snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name  "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: prices $(date -u +%F)"
          git push

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/
          rm -rf _site/data/snapshots   # keep raw snapshots in repo, not on the site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
